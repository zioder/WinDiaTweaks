# DiaTweaks for Windows - tweak definitions
# Windows counterparts of the tweaks in JaceThings/DiaTweaks (macOS), matched to Dia for Windows' own UI.
# Switch them in Dia (Settings > Patches) or with `diatweaks enable <key>`.
#
# A tweak:
#   [key] on|off
#   title:   name shown in Settings > Patches
#   desc:    one-line description
#   section: group heading in Settings > Patches
#   icon:    Segoe Fluent Icons code point (hex)
#   value:   current option, for tweaks that have one
#   choices: value=Label, value=Label   (shown as a drop-down; with an "off" choice, the drop-down
#            replaces the On/Off switch and picking "off" turns the tweak off)
#   switch:  none   (a drop-down only, always on: an option of the tweak above it)
#   restart: yes    (applies when Dia next opens: changing it shows a "Reopen Dia" button)
#   match <condition>... => Property=Value; Property=Value
#
# Conditions (all must hold):
#   type=<element type>   name=<element name>   index=<child index>
#   parentType=<type>     parentName=<name>     ancestor=<name>   ancestorType=<type>
#   upN=<name>            the element N levels up has this name (up1 = parent)
#   tweak=<key>           another tweak is on
#   value=<value>         this tweak's own option is <value>
#   state=<state>         hover (pointer at the window top), sidebarOpen, newTab, showToolbar, split
#   ~<text> as a value means "contains", and a "!" after the field name means "not".
# Values are written the way WinUI prints them: Visibility=Collapsed, Margin=0,0,0,0, Opacity=0.5.
# Tweaks with no match lines are implemented in code (src/ui.cpp).

[preset] on
title: Preset
desc: A ready-made set of patches.
icon: E771
value: none
choices: none=None, arc=Arc, arcWindows=Arc (Windows), custom=Custom

[edgeToEdge] off
title: Edge-to-edge web content
desc: No gap around pages.
section: Page
icon: E740
match type=Grid index=0 up2=ClientAreaPresenter => Margin=0,0,0,0

[squareCorners] off
title: Square corners by the sidebar
desc: Straight page corners.
section: Page
icon: E739

[peek] off
title: Peek
desc: Preview links in a card.
section: Peek
icon: E890
# Done in code (src/peek.cpp). Peek clips a live Dia window to the card.

[peekTrigger] on
title: Trigger
desc: How a Peek opens.
section: Peek
icon: E8B0
switch: none
value: shift
choices: shift=Shift+click, hold=Hold on a link, ctrlShift=Ctrl+Shift+click, alt=Alt+click

[peekAnimation] on
title: Animation
desc: How the card flies in and out.
section: Peek
icon: E7F4
switch: none
value: genie
choices: genie=Genie, easeInOut=Ease In/Out, zoom=Zoom

[peekExpand] on
title: Open as tab
desc: How a Peek becomes a tab.
section: Peek
icon: E740
switch: none
value: blend
choices: blend=Blend, dissolve=Dissolve, moveFirst=Move first, snap=Snap

[hideToolbar] off
title: Hide toolbar (reveal on hover)
desc: Shows the toolbar only on hover.
section: Toolbar
icon: E8A0
# Done in code (src/ui.cpp): the toolbar slides up out of the window together with the page, and back
# down while the pointer is at the top edge, when a "show toolbar" tweak below wants it, or while you
# type in the address bar.

[showToolbarWithSidebar] off
title: Show toolbar with the sidebar
desc: Keeps the toolbar while the sidebar is open.
section: Toolbar
icon: E8A9

[showToolbarOnNewTab] off
title: Show toolbar on new tab pages
desc: Keeps the toolbar on new tabs.
section: Toolbar
icon: E710

[toolbarColor] off
title: Toolbar color
desc: Toolbar and window button color.
section: Toolbar
icon: E790
value: sidebar
choices: off=Adaptive (Following Site), sidebar=Sidebar
# Done in code (src/ui.cpp). Sidebar: the toolbar strip turns see-through (sidebar color or window
# material shows) and its icons and the window buttons take the sidebar's text color.

[arcUrlBar] off
title: Address bar
desc: Where the address and navigation buttons sit.
section: Toolbar
icon: E8A1
value: sidebar
choices: off=Toolbar (Dia), sidebar=Sidebar (Arc for Mac), windows=Centered (Arc for Windows)
# Sidebar: address bar and buttons in the sidebar (Arc on macOS). Centered: the toolbar stays (in the
# sidebar's color) and shows just the site, centered between its page buttons; clicking it opens the
# command bar centered over the window. Done in code (src/ui.cpp).
# Arc (Windows): no loading bar in the address field.
match name=LoadingIndicatorLayer value=windows => Visibility=Collapsed
# Split view (Arc only): each pane's own toolbar keeps only its close (X) button; the selected pane's controls are
# in the sidebar. (Controls currently in the sidebar aren't under a page toolbar, so they stay visible.)
match name=SidebarToggleButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=BackButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ForwardButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ReloadButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=AssistantBarHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=StatusPill ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=PinnedExtensionsHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=DownloadsHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ShareArtifactButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ExportLogsButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=AdvancedChatUpsellHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ChatButtonHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed

[floatingNewTab] off
title: Floating new tab bar
desc: Ctrl+T opens a floating address bar.
section: Toolbar
icon: E710

[alwaysShowAddressField] off
title: Always show address field
desc: Address field always visible.
section: Toolbar Items
icon: E721

[hideSidebarButton] off
title: Hide sidebar button
desc: Hides the sidebar button.
section: Toolbar Items
icon: E89F
match name=SidebarToggleButton => Visibility=Collapsed

[hideTabSearchButton] off
title: Hide tab search button
desc: Hides the tab search button.
section: Toolbar Items
icon: E721
match name=OverflowButton ancestor=WindowDragHeader => Visibility=Collapsed

[hideChatButton] off
title: Hide Chat button
desc: Hides the Chat button.
section: Toolbar Items
icon: E8BD
match name=ChatButtonHost => Visibility=Collapsed

[pinnedExtensions] off
title: Pinned extensions shown
desc: More than Dia's 4 by the address bar. Applies when Dia next opens.
section: Toolbar Items
icon: EA86
restart: yes
value: 8
choices: off=4 (Dia), 6=6, 8=8, 10=10, 12=12, 16=16
# Done in code (src/tap.cpp): Dia's PinnedExtensionsViewModel keeps min(count, 4) and shows the
# overflow button from 5; the add-on raises those numbers in Dia's memory when it attaches.

[hideLoadingAnimation] off
title: Hide page loading animation
desc: Hides the loading bar in the address field.
section: Toolbar Items
icon: E916
match name=LoadingIndicatorLayer => Visibility=Collapsed

[cleanSearchBox] off
title: Clean search box
desc: New Tab, Ctrl+L and Ctrl+T boxes as one search line, send button at the side.
section: New Tab
icon: E721
# Done in code (src/ui.cpp): in the New Tab page's box and the Ctrl+L / Ctrl+T command bar, the bottom
# row ("Add tabs or files" and send) goes; the send button moves up to the right end of the text line.
# Chat is left alone.

[hideHistorySuggestions] off
title: Hide history suggestions
desc: Leaves pages you've visited and past searches out of the address and command bar suggestions.
section: New Tab
icon: E81C
# Done in code (src/history.cpp): Chromium's suggestions are filtered before Dia shows them, as on
# macOS. Searching, Chat, search suggestions and open tabs still show. History itself is kept.

[hidePinnedTabBorder] off
title: Hide pinned tab border
desc: No border on the selected pinned tab.
section: Sidebar & Tab Bar
icon: E718
match type=Border index=1 up4=DockHost => BorderThickness=0,0,0,0
match type=Border index=2 up4=DockHost => BorderThickness=0,0,0,0

[arcPinnedTabs] off
title: Arc pinned tabs
desc: Like Arc: hover a pinned tab for ✕, or – to go back to its pinned page.
section: Sidebar & Tab Bar
icon: E718
# Done in code (src/ui.cpp), like Arc: a pinned tab that has left its pinned page shows – at its
# right end on hover, which takes it back (Dia's own Back to Pinned URL). One still on its page shows
# ✕ (Dia's own Close tab), which Dia otherwise leaves off pinned tabs outside folders. Dia's own
# away look goes: no "/" after the icon, no "Back to Pinned URL" line under the title.

[hideTabHoverCard] off
title: Hide tab hover card
desc: No card when hovering tabs.
section: Sidebar & Tab Bar
icon: E8F3
# Done in code (src/ui.cpp): the card is a flyout (TitleText, SubtitleText, ActionsRow); its
# FlyoutPresenter is collapsed before it's drawn. Other flyouts and menus are left alone.

[profileEmoji] off
title: Profile Emojis
desc: An emoji in place of each profile's dot. Choose them in Settings > Profiles, or right-click a dot.
section: Sidebar & Tab Bar
icon: E76E
value: 🙂
# Done in code (src/ui.cpp). The option holds the emojis: "Default=💼, Profile 3=🏠, 🙂", a profile by
# its folder in Dia's user data (it keeps its emoji when renamed) or by its name (moved to its folder
# once known); an emoji alone is for profiles without one. Set from Dia's profile UI, not Patches.

[dontPopUpDownloads] off
title: Don't pop up downloads
desc: Downloads list stays closed.
section: Sidebar & Tab Bar
icon: E896

[translucentSidebar] off
title: Translucent sidebar
desc: See the page through the floating sidebar.
section: Sidebar & Tab Bar
icon: E790
match name=SidebarFloatingSurface => Opacity=0.7

[tidyTabs] off
title: Tidy Tabs
desc: A line above your tabs with Tidy and Clear.
note: Tidy uses your Dia chat: each tidy counts toward your chat usage and is saved in your chat history.
section: Tidy Tabs
icon: E8CB
# Done in code (src/ui.cpp), after DiaTweaks' Tidy Tabs on macOS: a line at the top of your tabs with
# Tidy (a broom) and Clear. Tidy asks Dia's chat, opened out of sight and without its end-of-reply
# sound, to group your open tabs by topic; its own tools make, name and color the groups, and the line
# rolls as a wave until it's done. Clear is Dia's own Close All Tabs (sidebar right-click), confirmed.
# (Tidy needs a web page in front: Dia's chat is off on the New Tab page.)

[tidyTabsShow] on
title: Show
desc: When the line with the buttons shows.
section: Tidy Tabs
icon: E7B3
switch: none
value: hover
choices: hover=On hover, always=Always

[tidyTabsStyle] on
title: Buttons
desc: How the buttons look.
section: Tidy Tabs
icon: E8A9
switch: none
value: text
choices: icons=Icons only, text=Icons with text

[tidyTabsButtons] on
title: Which buttons
desc: What the line offers.
section: Tidy Tabs
icon: E71D
switch: none
value: both
choices: both=Tidy and Clear, tidy=Tidy only, clear=Clear only

[mediaControls] off
title: Media Controls
desc: A card for tabs playing in the background.
section: Media Controls
icon: E8D6
# Done in code (src/media.cpp), after DiaTweaks' Media Controls on macOS: when a tab you've switched away
# from plays sound, a card at the bottom of the sidebar shows it with play/pause, next and mute (previous
# and a ✕ on hover). Clicking the card goes back to the tab. Play/pause, next and previous go through
# Windows' media controls, which hold one Dia tab at a time; other playing tabs get mute only.

[mediaControlsPiP] off
title: Wait for Picture in Picture
desc: No card while the video is in picture in picture.
section: Media Controls
icon: E8A7

[hideWindowButtons] off
title: Hide window buttons
desc: Hides minimize, maximize and close.
section: Window
icon: E8BB
# Hiding the buttons is done in code (src/ui.cpp) so their spots also stop acting as buttons.
match name=NavigationBarContent => Margin=0,0,0,0

[windowMaterial] off
title: Window material
desc: Mica or Acrylic behind the sidebar.
section: Window
icon: E771
value: mica
choices: mica=Mica, micaAlt=Mica Alt, acrylic=Acrylic

[normalLaunch] off
title: Patch Dia however it's opened
desc: Patches Dia from any icon or link.
section: Opening Dia
icon: E8A7
# Done in code (src/diatweaks.cpp): DiaLauncher.exe --watch, started at sign-in from the Startup folder.

[checkForUpdates] on
title: Check for updates automatically
desc: Checks for updates when Dia opens.
section: Updates
icon: E895
# Done in code (src/ui.cpp): runs `diatweaks check` in the background; updates install with `diatweaks update`.
